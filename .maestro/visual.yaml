appId: app.nitronbox.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "NitronBox"
    timeout: 15000
- takeScreenshot: screenshots/01-onboarding
- tapOn: "Connection settings"
- extendedWaitUntil:
    visible: "Connect your model provider."
    timeout: 5000
- takeScreenshot: screenshots/02-settings
- tapOn: "API key"
- inputText: "visible_test_key"
- takeScreenshot: screenshots/03-keyboard

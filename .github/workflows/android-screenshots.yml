name: Android UI Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --clean --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Capture UI states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p screenshots
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            "$HOME/.maestro/bin/maestro" test .maestro/visual.yaml
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml screenshots/window.xml
      - uses: actions/upload-artifact@v4
        with:
          name: NitronBox-UI-screenshots
          path: screenshots

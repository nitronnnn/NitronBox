name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk NitronBox-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NitronBox-APK
          path: NitronBox-*.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" NitronBox-*.apk --clobber

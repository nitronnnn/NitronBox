name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --clean --platform android --no-install
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify embedded offline bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk > apk-contents.txt
          grep -q "assets/index.android.bundle" apk-contents.txt
          grep -q "lib/arm64-v8a/libhermes.so" apk-contents.txt
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NitronBox-${GITHUB_REF_NAME}-standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NitronBox-APK
          path: NitronBox-*-standalone.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" NitronBox-*-standalone.apk --clobber
